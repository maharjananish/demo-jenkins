apiVersion: v1
kind: Service
metadata:
  name: my-app-svc
  namespace: default
spec:
  type: LoadBalancer             # AWS will create an ELB for you
  selector:
    app: my-app                  # routes traffic to pods with this label
  ports:
  - protocol: TCP
    port: 80                     # external port (internet sees port 80)
    targetPort: 5000             # internal port (your app listens here)
