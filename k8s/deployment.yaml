apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app
  namespace: default
spec:
  replicas: 1                    # run 2 copies of the app
  selector:
    matchLabels:
      app: my-app
  strategy:
    type: RollingUpdate          # update one pod at a time (zero downtime)
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
      - name: my-app
        image: IMAGE_PLACEHOLDER  # Jenkins will replace this
        ports:
        - containerPort: 5000
        
